<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>关于自设的一份小调查</title>
<style>
:root{
  --bg:#f6f5f3; --card:#fff; --ink:#1c1b19; --sub:#6b6862; --line:#e3e0da;
  --accent:#7a5c3e; --soft:#f0e9e0; --warn:#8a5a2b; --warnbg:#fdf6ec; --err:#a4462f;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#16161a; --card:#1e1e23; --ink:#e8e6e1; --sub:#9a968e; --line:#2e2e35;
    --accent:#c9a077; --soft:#2a2520; --warn:#d8ad74; --warnbg:#241d14; --err:#e08a6e; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.7 -apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  -webkit-font-smoothing:antialiased}
.banner{background:var(--warnbg);color:var(--warn);border-bottom:1px solid var(--line);
  padding:9px 14px;font-size:12.5px;text-align:center}
.banner b{font-weight:600}
.banner[hidden]{display:none}
.wrap{max-width:600px;margin:0 auto;padding:0 18px 60px}
.hd{display:flex;justify-content:space-between;align-items:baseline;
  font-size:12px;color:var(--sub);letter-spacing:1px;margin:22px 0}
.hd .sec{color:var(--accent);font-weight:600;letter-spacing:1.5px}
.qt{font-size:19px;line-height:1.6;font-weight:500;margin:0}
.req{color:var(--accent);margin-left:4px}
.tag{display:inline-block;font-size:11px;color:var(--sub);border:1px solid var(--line);
  border-radius:4px;padding:1px 6px;margin-left:7px;vertical-align:3px;font-weight:400;white-space:nowrap}
.hint{font-size:13.5px;color:var(--sub);margin:9px 0 0;line-height:1.75}
.note{background:var(--soft);border-radius:9px;padding:13px 15px;
  font-size:13.5px;color:var(--sub);line-height:1.75;margin:0 0 22px}
.mnote{font-size:13px;color:var(--sub);line-height:1.7;margin:14px 0 0}
.pre{border:1px dashed var(--line);border-radius:10px;padding:14px 15px;margin:0 0 24px}
.pre p{font-size:13.5px;color:var(--sub);margin:0 0 10px;line-height:1.7}
.opts{margin:22px 0 0;padding:0;list-style:none}
label.o{display:flex;gap:11px;align-items:flex-start;padding:12px 13px;border-radius:9px;
  cursor:pointer;font-size:15px;line-height:1.6;border:1px solid transparent;transition:.12s}
label.o:hover{background:var(--soft)}
label.o.sel{background:var(--soft);border-color:var(--accent)}
label.o input{margin:5px 0 0;accent-color:var(--accent);flex:none;width:17px;height:17px}
.otherbox{margin:6px 0 0 41px;width:calc(100% - 41px)}
input[type=text],textarea{width:100%;background:var(--card);border:1px solid var(--line);
  border-radius:9px;padding:12px 14px;color:var(--ink);font:inherit;font-size:15px;resize:vertical}
input[type=text]:focus,textarea:focus{outline:none;border-color:var(--accent)}
.extra{margin-top:24px;padding-top:20px;border-top:1px dashed var(--line)}
.extra p{font-size:13.5px;color:var(--sub);margin:0 0 10px;line-height:1.7}
.row{border:1px solid var(--line);border-radius:10px;padding:13px 14px;margin-bottom:10px;background:var(--card)}
.row.miss{border-color:var(--err)}
.rowt{font-size:14.5px;line-height:1.6;margin-bottom:11px}
.scale{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.scale label{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;
  color:var(--sub);padding:8px 2px;border-radius:7px;cursor:pointer;text-align:center;
  border:1px solid transparent;transition:.12s}
.scale label:hover{background:var(--soft)}
.scale label.sel{background:var(--soft);border-color:var(--accent);color:var(--ink)}
.scale input{accent-color:var(--accent);width:16px;height:16px;margin:0}
.sub{margin-top:26px;padding-top:20px;border-top:1px dashed var(--line)}
.sub>p{font-size:13.5px;color:var(--sub);margin:0;line-height:1.7}
.sub .opts{margin-top:12px}
.err{color:var(--err);font-size:13.5px;margin-top:16px;min-height:20px}
.nav{display:flex;gap:10px;margin-top:30px;padding-top:20px;border-top:1px solid var(--line)}
button{font:inherit;font-size:15px;border-radius:9px;padding:13px 22px;cursor:pointer;
  border:1px solid var(--line);background:transparent;color:var(--sub);transition:.12s}
button:hover{border-color:var(--accent);color:var(--accent)}
#next{flex:1;background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
#next:hover{opacity:.88;color:#fff}
button[hidden]{display:none}
.done{text-align:center;padding:54px 6px 14px}
.done .big{font-size:21px;font-weight:500;margin-bottom:14px}
.done p{color:var(--sub);font-size:14.5px;margin:0 0 8px}
.tools{margin-top:34px;padding-top:22px;border-top:1px solid var(--line);
  display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.tools button{font-size:13.5px;padding:9px 16px}
.tools[hidden]{display:none}
pre{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:14px;
  font-size:12px;line-height:1.6;overflow:auto;max-height:280px;text-align:left;
  white-space:pre-wrap;word-break:break-all;color:var(--sub);margin-top:16px}
</style>
</head>

function visible(q){ return !q.show || q.show(); }
function visList(){
  if(A['q1']===undefined){
    A['q1']=0; var r=Q.filter(visible); delete A['q1']; return r;
  }
  return Q.filter(visible);
}
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

var stage=document.getElementById('stage'), errEl=document.getElementById('err');
var secEl=document.getElementById('sec'), cntEl=document.getElementById('cnt');
var prevB=document.getElementById('prev'), nextB=document.getElementById('next');

// 随机排序：末项（兜底项）固定不参与
function orderFor(q){
  if(!q.random){ var a=[],z; for(z=0;z<q.opts.length;z++)a.push(z); return a; }
  if(randOrder[q.id]) return randOrder[q.id];
  var n=q.opts.length-1, arr=[], i, j, t;
  for(i=0;i<n;i++) arr.push(i);
  for(i=n-1;i>0;i--){ j=Math.floor(Math.random()*(i+1)); t=arr[i];arr[i]=arr[j];arr[j]=t; }
  arr.push(q.opts.length-1);
  randOrder[q.id]=arr; return arr;
}

function render(){
  errEl.textContent=pendErr; pendErr='';
  if(ended){ renderEnd(); return; }
  var q=Q[cur], vl=visList(), pos=vl.indexOf(q)+1;
  if(pos<1){ pos=1; }
  secEl.textContent=q.sec;
  // 只显示「第 N 题」——三条路径长度不同，显示总数会让人觉得问卷忽长忽短
  cntEl.textContent='第 '+pos+' 题';

  var h='<div class="qbody">';
  if(q.note) h+='<div class="note">'+esc(q.note)+'</div>';
  if(q.pre) h+='<div class="pre"><p>'+esc(q.pre.label)+'</p>'+
    '<input type="text" data-pre="1" maxlength="20" placeholder="'+esc(q.pre.ph)+
    '" value="'+esc(A[q.pre.id]||'')+'"></div>';
  h+='<h2 class="qt">'+esc(q.title)+(q.req?'<span class="req">*</span>':'');
  if(q.type==='multi') h+='<span class="tag">多选</span>';
  if(q.lim) h+='<span class="tag">最多 '+q.lim+' 项</span>';
  h+='</h2>';
  if(q.hint) h+='<p class="hint">'+esc(q.hint)+'</p>';
  if(q.mnote) h+='<p class="mnote">'+esc(q.mnote)+'</p>';

  if(q.type==='single'||q.type==='multi'){
    h+='<ul class="opts">';
    orderFor(q).forEach(function(i){
      var on = q.type==='single' ? A[q.id]===i : has(q.id,i);
      h+='<li><label class="o'+(on?' sel':'')+'" data-i="'+i+'">'+
        '<input type="'+(q.type==='single'?'radio':'checkbox')+'" '+(on?'checked':'')+
        ' name="'+q.id+'">'+esc(q.opts[i])+'</label>';
      if(q.other&&q.other.indexOf(i)>=0&&on)
        h+='<input class="otherbox" type="text" data-other="1" placeholder="请填写" value="'+
          esc(A[q.id+'_other']||'')+'">';
      h+='</li>';
    });
    h+='</ul>';
    if(q.extra){
      h+='<div class="extra"><p>'+esc(q.extra.label)+'</p>'+
         '<input type="text" data-extra="1" placeholder="'+esc(q.extra.ph)+
         '" value="'+esc(A[q.extra.id]||'')+'"></div>';
    }
  }
  else if(q.type==='matrix'){
    var v=A[q.id]||[];
    q.rows.forEach(function(rt,ri){
      h+='<div class="row" data-row="'+ri+'" role="radiogroup" aria-label="'+esc(rt)+'">'+
         '<div class="rowt">'+esc(rt)+'</div><div class="scale">';
      q.cols.forEach(function(c,ci){
        h+='<label class="'+(v[ri]===ci?'sel':'')+'" data-row="'+ri+'" data-col="'+ci+'">'+
          '<input type="radio" name="'+q.id+'_'+ri+'" aria-label="'+esc(rt+' —— '+c)+'" '+
          (v[ri]===ci?'checked':'')+'>'+esc(c)+'</label>';
      });
      h+='</div></div>';
    });
    if(q.sub){
      var sv=A[q.sub.id]||[];
      h+='<div class="sub"><p>'+esc(q.sub.label)+'</p><ul class="opts">';
      q.sub.opts.forEach(function(o,i){
        var on=sv.indexOf(i)>=0;
        h+='<li><label class="o'+(on?' sel':'')+'" data-sub="'+i+'">'+
          '<input type="checkbox" '+(on?'checked':'')+' name="'+q.sub.id+'">'+esc(o)+'</label></li>';
      });
      h+='</ul></div>';
    }
  }
  h+='</div>';
  stage.innerHTML=h;
  bind(q);
  prevB.hidden = histIdx.length===0;
  nextB.textContent = (vl.indexOf(q)===vl.length-1) ? '提交' : '下一题';
  // 只在换题时回到顶部——点一个选项就弹回页首会让矩阵和长清单没法作答
  if(lastQid!==q.id) window.scrollTo(0,0);
  lastQid=q.id;
}

function bind(q){
  var pre=stage.querySelector('[data-pre]');
  if(pre) pre.addEventListener('input',function(){ A[q.pre.id]=pre.value; });

  if(q.type==='single'||q.type==='multi'){
    [].forEach.call(stage.querySelectorAll('label.o'),function(l){
      l.addEventListener('click',function(e){
        e.preventDefault();
        var i=+l.getAttribute('data-i');
        if(q.type==='single'){
          var was=A[q.id];
          A[q.id]=i;
          if(q.other && q.other.indexOf(i)<0) delete A[q.id+'_other'];
          if(q.id==='q1' && was!==i) clearBranch();
          if(q.id==='c2') clearHidden(['c3']);
          if(q.id==='t2' && !adult()){ delete A['t3']; delete A['t3c']; }
        } else {
          var v=A[q.id]||[], at=v.indexOf(i), isE = q.excl && q.excl.indexOf(i)>=0;
          if(at>=0){
            v.splice(at,1);
            if(q.other && q.other.indexOf(i)>=0) delete A[q.id+'_other'];
          }
          else if(isE){
            v=[i];
            delete A[q.id+'_other'];
          }
          else{
            if(q.excl) v=v.filter(function(x){return q.excl.indexOf(x)<0});
            if(q.lim && v.length>=q.lim){
              pendErr='最多选 '+q.lim+' 个，想换的话先取消一个。'; render(); return;
            }
            v.push(i);
          }
          A[q.id]=v;
          // 改了工具清单、且不再满足条件时，清掉 a9 / a10 的旧答案
          if(q.id==='a8' && !usedChar()) clearHidden(['a9','a10']);
        }
        render();
      });
    });
    [].forEach.call(stage.querySelectorAll('[data-other]'),function(inp){
      inp.addEventListener('input',function(){ A[q.id+'_other']=inp.value; });
      inp.addEventListener('click',function(e){ e.stopPropagation(); });
    });
    var ex=stage.querySelector('[data-extra]');
    if(ex) ex.addEventListener('input',function(){ A[q.extra.id]=ex.value; });
  }
  else if(q.type==='matrix'){
    [].forEach.call(stage.querySelectorAll('.scale label'),function(l){
      l.addEventListener('click',function(e){
        e.preventDefault();
        var ri=+l.getAttribute('data-row'), ci=+l.getAttribute('data-col');
        var v=A[q.id]||[]; v[ri]=ci; A[q.id]=v;
        // 原地改高亮，不重建整页——否则每点一行都被弹回顶部
        var row=stage.querySelector('.row[data-row="'+ri+'"]');
        row.classList.remove('miss');
        [].forEach.call(row.querySelectorAll('.scale label'),function(x){
          var on=(+x.getAttribute('data-col')===ci);
          x.className = on ? 'sel' : '';
          x.querySelector('input').checked = on;
        });
        errEl.textContent='';
      });
    });
    [].forEach.call(stage.querySelectorAll('[data-sub]'),function(l){
      l.addEventListener('click',function(e){
        e.preventDefault();
        var i=+l.getAttribute('data-sub'), v=A[q.sub.id]||[], at=v.indexOf(i);
        if(at>=0) v.splice(at,1); else v.push(i);
        A[q.sub.id]=v;
        var on=v.indexOf(i)>=0;
        l.className='o'+(on?' sel':'');
        l.querySelector('input').checked=on;
      });
    });
  }
}

// 改了分流题就清掉所有已经不该出现的分支答案，防止残留混进导出
function clearBranch(){
  clearHidden(['a2','a3','a4','a5','a6','a7','a8','a9','a10',
    'b2','b3','b4','b5','b6','b7','b8','c2','c3','c4','c5']);
  if(!own()) delete A['aname'];
  if(!fav()) delete A['bname'];
}
function clearHidden(ids){
  ids.forEach(function(k){
    var q=null; for(var i=0;i<Q.length;i++) if(Q[i].id===k) q=Q[i];
    if(q && !visible(q)){
      delete A[k]; delete A[k+'_other'];
      if(q.sub) delete A[q.sub.id];
      if(q.pre) delete A[q.pre.id];
    }
  });
}

function validate(q){
  // 「其他」勾了但没填字
  if(q.other && A[q.id]!==undefined){
    var picked = (q.type==='multi') ? A[q.id] : [A[q.id]];
    for(var k=0;k<q.other.length;k++)
      if(picked.indexOf(q.other[k])>=0 && !(A[q.id+'_other']||'').replace(/\s/g,''))
        return '「其他」那一项要填一下才能继续。';
  }
  if(!q.req) return null;
  var v=A[q.id];
  if(q.type==='single') return (v===undefined)?'选一个再往下吧。':null;
  if(q.type==='multi')  return (!v||!v.length)?'至少选一个再往下吧。':null;
  if(q.type==='matrix'){
    if(!v) v=[];
    var miss=0, first=null;
    for(var i=0;i<q.rows.length;i++) if(v[i]===undefined){
      miss++;
      var el=stage.querySelector('.row[data-row="'+i+'"]');
      if(el&&el.classList){ el.classList.add('miss'); if(!first) first=el; }
    }
    if(first && first.scrollIntoView) first.scrollIntoView({block:'center'});
    if(miss) return '还有 '+miss+' 行没选，已经帮你跳到第一行没选的了。';
  }
  return null;
}

function renderEnd(){
  secEl.textContent='最后'; cntEl.textContent='完成';
  stage.innerHTML='<div class="done"><div class="big">填完了，谢谢你。</div>'+
    '<p>如果整理出什么有意思的，会发回群里。</p>'+
    '<div class="tools"'+(PREVIEW?'':' hidden')+'><button id="see">看这次的答案</button>'+
    '<button id="again">重新走一遍</button></div>'+
    '<pre id="dump" hidden></pre></div>';
  prevB.hidden=false; nextB.hidden=true;
  if(PREVIEW){
    document.getElementById('see').onclick=function(){
      var d=document.getElementById('dump'); d.hidden=!d.hidden; d.textContent=dump(); };
    document.getElementById('again').onclick=function(){
      A={}; histIdx=[]; cur=0; ended=false; randOrder={}; lastQid=null;
      nextB.hidden=false; render(); };
  }
}

// 只在样稿模式下用得到；回显题面而不是字段 id
function dump(){
  var out=[];
  Q.forEach(function(q){
    if(!visible(q)) return;
    if(q.pre && A[q.pre.id]) out.push('TA 的名字：'+A[q.pre.id]);
    var v=A[q.id], s;
    if(v===undefined||v===''||(Array.isArray(v)&&!v.length)) s='（未答）';
    else if(q.type==='single') s=q.opts[v];
    else if(q.type==='multi') s=v.map(function(i){return q.opts[i]}).join(' | ');
    else if(q.type==='matrix') s=q.rows.map(function(r,i){
      return (i+1)+'='+(q.cols[v[i]]||'—'); }).join('　');
    else s=v;
    if(A[q.id+'_other'] && q.other){
      var picked = Array.isArray(A[q.id]) ? A[q.id] : (A[q.id]===undefined?[]:[A[q.id]]);
      for(var k=0;k<q.other.length;k++)
        if(picked.indexOf(q.other[k])>=0){ s+='（其他：'+A[q.id+'_other']+'）'; break; }
    }
    out.push(q.title+'：'+s);
    if(q.sub && A[q.sub.id] && A[q.sub.id].length)
      out.push('　└ 条件：'+A[q.sub.id].map(function(i){return q.sub.opts[i]}).join(' | '));
    if(q.extra && A[q.extra.id]) out.push('　└ 联系方式：'+A[q.extra.id]);
  });
  return out.join('\n');
}

nextB.onclick=function(){
  var q=Q[cur], e=validate(q);
  if(e){ errEl.textContent=e; return; }
  var vl=visList();
  if(vl.indexOf(q)===vl.length-1){ ended=true; render(); return; }
  histIdx.push(cur);
  var n=cur+1;
  while(n<Q.length && !visible(Q[n])) n++;
  if(n>=Q.length){ ended=true; render(); return; }
  cur=n; render();
};
prevB.onclick=function(){
  if(ended){ ended=false; nextB.hidden=false; lastQid=null; render(); return; }
  while(histIdx.length){
    var p=histIdx.pop();
    if(visible(Q[p])){ cur=p; lastQid=null; render(); return; }
  }
};
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter') return;
  if(e.isComposing || e.keyCode===229) return;   // 中文输入法确认候选词，不算提交
  if(ended) return;
  var t=document.activeElement;
  if(t && (t.tagName==='TEXTAREA' || t.tagName==='BUTTON')) return;
  if(Q[cur] && Q[cur].id==='t3') return;          // 最后一题不给回车提交
  e.preventDefault(); nextB.click();
});

render();
})();
</script>
</body>
